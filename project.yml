name: ABSURDAI
options:
  bundleIdPrefix: com.absurdai
  deploymentTarget:
    iOS: "17.0"
targets:
  ABSURDAI:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - target: ABSURDAIWidgets
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.absurdai.prototype
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ABSURDAIWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - Widgets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.absurdai.prototype.widgets
      SWIFT_VERSION: "5.9"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSSupportsLiveActivities: YES